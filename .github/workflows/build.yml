name: build

# На каждый push и pull request: go vet, тесты, сборка.
# На тег vX.Y.Z: ещё и установщик, и релиз на GitHub с двумя файлами —
# ProDJTools-Setup-X.Y.Z.exe и переносным ProDJTools.exe.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Go скачивается в .goenv скриптом activate.ps1; кэш экономит загрузку.
      - uses: actions/cache@v4
        with:
          path: .goenv
          key: goenv-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Проверки, тесты и сборка
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: .\build.ps1

      - name: Установщик
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .\build-installer.ps1 -Version '${{ github.ref_name }}'

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ProDJTools-Setup-*.exe
            ProDJTools.exe
