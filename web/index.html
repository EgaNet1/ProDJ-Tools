<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProDJ Tools</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<!-- Texts come from web/i18n/<language>.json: data-i18n fills an element's
     text, data-i18n-html its markup, data-i18n-title / -label / -placeholder
     the attributes. The page stays hidden until they are in place. -->
<body class="loading">
  <header class="bar">
    <div class="brand">ProDJ<span>Tools</span><small class="version" id="version"></small></div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-view="set" aria-selected="true" data-i18n="tab.set"></button>
      <button role="tab" data-view="mix" aria-selected="false" data-i18n="tab.mix"></button>
      <button role="tab" data-view="tools" aria-selected="false" data-i18n="tab.tools"></button>
      <button role="tab" data-view="export" aria-selected="false" data-i18n="tab.export"></button>
    </nav>

    <div class="folder">
      <button class="folder-path" id="folder-toggle" aria-haspopup="true" aria-expanded="false">
        <span id="folder-name"></span>
        <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <div class="folder-menu" id="folder-menu" hidden>
        <button class="primary wide" data-act="pick" data-i18n="folder.pick"></button>
        <form class="paste" id="paste-form">
          <input name="dir" data-i18n-placeholder="folder.paste" autocomplete="off" spellcheck="false">
          <button data-i18n="folder.open"></button>
        </form>
        <p class="label" data-i18n="folder.recent"></p>
        <ul class="recent" id="recent-menu"></ul>
      </div>
    </div>

    <div class="lang">
      <button class="lang-toggle" id="lang-toggle" aria-haspopup="true" aria-expanded="false" data-i18n-title="lang.choose" data-i18n-label="lang.choose">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.8 2.5 3.9 2.5 6.2S9.7 12.4 8 14.2M8 1.8C6.3 3.6 5.5 5.7 5.5 8s.8 4.4 2.5 6.2"/></svg>
        <span id="lang-code"></span>
      </button>
      <ul class="lang-menu" id="lang-menu" role="menu" hidden></ul>
    </div>

    <a class="icon github" id="github" href="https://github.com/EgaNet1" target="_blank" rel="noopener" data-i18n-title="github" data-i18n-label="github">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="solid" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <main>
    <!-- ───────────────────────────── Set ───────────────────────────── -->
    <section class="view" id="view-set">
      <div class="welcome" id="welcome" hidden>
        <img class="logo" src="/icon.png" alt="" width="72" height="72">
        <h1 data-i18n="welcome.title"></h1>
        <p data-i18n="welcome.text"></p>
        <button class="primary" data-act="pick" data-i18n="folder.pick"></button>
        <ul class="recent" id="recent-welcome"></ul>
      </div>

      <div class="scanning" id="scanning" hidden>
        <p class="label" data-i18n="scan.label"></p>
        <div class="progress"><div id="scan-bar"></div></div>
        <p class="scan-text"><span id="scan-count"></span><span id="scan-file"></span></p>
      </div>

      <div class="set" id="set" hidden>
        <div class="set-main">
          <div class="cols" aria-hidden="true">
            <span></span><span>#</span><span></span><span data-i18n="col.track"></span><span data-i18n="col.wave"></span>
            <span class="r">BPM</span><span data-i18n="col.key"></span><span data-i18n="col.energy"></span><span class="r" data-i18n="col.time"></span><span></span><span></span>
          </div>
          <ol class="setlist" id="setlist"></ol>
          <details class="bench" id="bench">
            <summary><span data-i18n="bench.title"></span> <span id="bench-count"></span></summary>
            <ul id="bench-list"></ul>
          </details>
          <ul class="scan-errors" id="scan-errors"></ul>
        </div>

        <aside class="side">
          <dl class="stats" id="stats"></dl>
          <figure class="chart">
            <svg id="chart" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
            <figcaption><span class="swatch bars"></span><span data-i18n="chart.energy"></span> <span class="swatch line"></span><span id="curve-name"></span></figcaption>
          </figure>
          <button class="primary wide" id="build" data-i18n="set.build"></button>
          <button class="ghost wide" id="unlock-all" hidden data-i18n="set.unlock_all"></button>
          <p class="hint" data-i18n="set.hint"></p>
        </aside>
      </div>
    </section>

    <!-- ─────────────────────────── Mixing ─────────────────────────── -->
    <section class="view mix" id="view-mix" hidden>
      <header class="mix-head">
        <div>
          <h1 data-i18n="mix.title"></h1>
          <p data-i18n="mix.text"></p>
        </div>
        <div class="mix-actions">
          <button class="ghost" id="mix-copy" data-i18n="mix.copy"></button>
          <button class="primary" id="mix-save" data-i18n="mix.save"></button>
        </div>
      </header>

      <div class="mix-bar">
        <div class="segmented" id="mix-mode" role="tablist">
          <button role="tab" data-mode="transitions" data-i18n="mix.view.transitions"></button>
          <button role="tab" data-mode="cues" data-i18n="mix.view.cues"></button>
        </div>
        <p class="mix-how-short" id="mix-how-short"></p>
      </div>

      <ol class="mix-list" id="mix-transitions"></ol>

      <div class="mix-cues" id="mix-cues" hidden>
        <section class="panel cue-guide">
          <h2 data-i18n="mix.legend"></h2>
          <ul class="cue-legend" id="cue-legend"></ul>
          <ul class="kind-legend" id="kind-legend"></ul>
        </section>
        <div class="cue-cards" id="mix-tracks"></div>
      </div>

      <details class="panel how">
        <summary data-i18n="mix.how.title"></summary>
        <ol>
          <li data-i18n-html="mix.how.auto"></li>
          <li data-i18n-html="mix.how.manual"></li>
          <li data-i18n-html="mix.how.grid"></li>
        </ol>
      </details>
    </section>

    <!-- ────────────────────────── Tools ───────────────────────── -->
    <section class="view tools" id="view-tools" hidden>
      <article class="panel span-2">
        <header><h2 data-i18n="curves.title"></h2><p data-i18n="curves.text"></p></header>
        <div class="curves" id="curves"></div>
      </article>

      <article class="panel">
        <header><h2 data-i18n="weights.title"></h2><p data-i18n="weights.text"></p></header>
        <div class="sliders">
          <label><span data-i18n="weights.harmony"></span><input type="range" min="0" max="100" step="5" data-weight="harmony"><output></output></label>
          <label><span data-i18n="weights.tempo"></span><input type="range" min="0" max="100" step="5" data-weight="tempo"><output></output></label>
          <label><span data-i18n="weights.energy"></span><input type="range" min="0" max="100" step="5" data-weight="energy"><output></output></label>
        </div>
        <button class="ghost" id="weights-reset" data-i18n="weights.reset"></button>
      </article>

      <article class="panel">
        <header><h2 data-i18n="slot.title"></h2><p data-i18n="slot.text"></p></header>
        <div class="fields">
          <label class="field"><span data-i18n="slot.minutes"></span><input type="number" id="slot-minutes" min="10" max="600" step="5" value="60"></label>
          <label class="field"><span data-i18n="slot.overlap"></span><input type="number" id="overlap" min="0" max="120" step="5" value="30"></label>
        </div>
        <button class="primary" id="build-slot" data-i18n="slot.build"></button>
        <p class="result" id="slot-result"></p>
      </article>

      <article class="panel span-2 next">
        <header><h2 data-i18n="next.title"></h2><p data-i18n="next.text"></p></header>
        <div class="next-grid">
          <div>
            <div class="next-controls">
              <select id="next-from" data-i18n-label="next.current"></select>
              <div class="segmented" id="next-direction" role="radiogroup" data-i18n-label="col.energy">
                <button data-dir="-1" role="radio" data-i18n="next.calmer"></button>
                <button data-dir="0" role="radio" data-i18n="next.same"></button>
                <button data-dir="1" role="radio" data-i18n="next.stronger"></button>
              </div>
            </div>
            <ol class="suggestions" id="suggestions"></ol>
          </div>
          <figure class="wheel-box">
            <svg id="wheel" viewBox="0 0 240 240"></svg>
            <figcaption data-i18n="next.wheel"></figcaption>
          </figure>
        </div>
      </article>

      <article class="panel">
        <header><h2 data-i18n="checks.title"></h2><p data-i18n="checks.text"></p></header>
        <ol class="checks" id="checks"></ol>
      </article>

      <article class="panel">
        <header><h2 data-i18n="octave.title"></h2><p data-i18n="octave.text"></p></header>
        <div class="choices" id="bpm-floor">
          <label><input type="radio" name="floor" value="70"><span><b>70–140</b><small data-i18n="octave.70"></small></span></label>
          <label><input type="radio" name="floor" value="88"><span><b>88–176</b><small>house, dubstep, riddim, DnB</small></span></label>
          <label><input type="radio" name="floor" value="100"><span><b>100–200</b><small>hardstyle, hardcore, footwork</small></span></label>
        </div>
      </article>
    </section>

    <!-- ──────────────────────────── Export ─────────────────────────── -->
    <section class="view export" id="view-export" hidden>
      <article class="panel">
        <header><h2 data-i18n="export.title"></h2><p data-i18n="export.text"></p></header>
        <label class="field"><span data-i18n="export.name"></span><input id="ex-name" spellcheck="false"></label>
        <div class="checks-list">
          <label class="check"><input type="checkbox" id="ex-rename" checked><span><b data-i18n="export.rename"></b><small data-i18n="export.rename.hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ex-tags" checked><span><b data-i18n="export.tags"></b><small data-i18n="export.tags.hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ex-bpmkey"><span><b data-i18n="export.bpmkey"></b><small data-i18n="export.bpmkey.hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ex-m3u" checked><span><b data-i18n="export.m3u"></b><small data-i18n="export.m3u.hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ex-cues" checked><span><b data-i18n="export.cues"></b><small data-i18n="export.cues.hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ex-xml" checked><span><b>Rekordbox XML</b><small data-i18n="export.xml.hint"></small></span></label>
        </div>
        <button class="primary" id="ex-run" data-i18n="export.run"></button>
      </article>

      <article class="panel">
        <header><h2 data-i18n="log.title"></h2><p data-i18n="log.text"></p></header>
        <ol class="log" id="ex-log"></ol>
      </article>

      <article class="panel">
        <header><h2 data-i18n="restore.title"></h2><p data-i18n="restore.text"></p></header>
        <button class="ghost" id="ex-restore" data-i18n="restore.run"></button>
      </article>
    </section>
  </main>

  <footer class="deck" id="deck">
    <button class="icon play-big" id="deck-play" disabled></button>
    <div class="now">
      <b id="deck-title"></b>
      <span id="deck-sub"></span>
    </div>
    <div class="scrub" id="deck-scrub"><div id="deck-fill"></div></div>
    <span class="clock" id="deck-clock">0:00</span>
    <div class="volume">
      <button class="icon" id="mute"></button>
      <input type="range" id="volume" min="0" max="100" step="1" data-i18n-label="volume.label">
    </div>
    <span class="keys" data-i18n-html="keys"></span>
  </footer>

  <audio id="audio-a" preload="none"></audio>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
